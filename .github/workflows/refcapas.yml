name: refcapas
on:
  push:
    paths: ['refcapas/lista.txt']
jobs:
  r:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp pillow
      - run: python3 refcapas/run.py
      - run: |
          cd out && git init -q && git checkout -q -b refcapas-out && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" refcapas-out
