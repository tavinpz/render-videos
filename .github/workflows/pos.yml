# Pós de um vídeo pronto: tapa os buracos de quadro (câmera perdeu quadros → imagem congela e parece fora de sincronia)
# com interpolação de movimento, acelera e exporta em alta. Áudio já tratado vem pronto (limpo.flac).
# Disparo: push que mude pos/<id>.txt (linhas: velocidade, máquinas, fps do vídeo — padrão 24). Entrada no ramo possrc-<id>: src.mp4.part_* + limpo.flac
# Saída: ramo saida-<id>pos com <id>.mp4 em pedaços de 90 MB + sha256.txt + quadros de conferência.
name: pos
on:
  push:
    paths: ['pos/*.txt']
jobs:
  plano:
    runs-on: ubuntu-latest
    outputs: { id: '${{ steps.p.outputs.id }}', vel: '${{ steps.p.outputs.vel }}', fps: '${{ steps.p.outputs.fps }}', n: '${{ steps.p.outputs.n }}', matriz: '${{ steps.p.outputs.matriz }}' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: p
        run: |
          F=$(git diff --name-only HEAD~1 HEAD -- pos | grep '\.txt$' | head -1); ID=$(basename "$F" .txt)
          VEL=$(sed -n 1p "$F"); N=$(sed -n 2p "$F" | tr -dc 0-9); [ -z "$N" ] && N=20
          FPS=$(sed -n 3p "$F" | tr -dc 0-9); [ -z "$FPS" ] && FPS=24; echo "fps=$FPS" >> $GITHUB_OUTPUT
          echo "id=$ID" >> $GITHUB_OUTPUT; echo "vel=$VEL" >> $GITHUB_OUTPUT; echo "n=$N" >> $GITHUB_OUTPUT
          echo "matriz=$(python3 -c "print(list(range($N)))")" >> $GITHUB_OUTPUT
  parte:
    needs: plano
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, max-parallel: 20, matrix: { k: '${{ fromJson(needs.plano.outputs.matriz) }}' } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: 'possrc-${{ needs.plano.outputs.id }}', path: src }
      - run: for i in 1 2 3; do command -v ffmpeg && break; (timeout 60 sudo apt-get update -qq && timeout 150 sudo apt-get install -y -qq ffmpeg > /dev/null) || sleep 5; done
      - name: parte ${{ matrix.k }}
        run: |
          cat src/src.mp4.part_* > src.mp4
          K=${{ matrix.k }}; N=${{ needs.plano.outputs.n }}; V=${{ needs.plano.outputs.vel }}; FPS=${{ needs.plano.outputs.fps }}
          TOT=$(ffprobe -v error -select_streams v -count_packets -show_entries stream=nb_read_packets -of csv=p=0 src.mp4)
          C=$(( (TOT + N - 1) / N )); A=$(( K * C )); Q=$(( TOT - A )); [ $Q -gt $C ] && Q=$C
          echo "total $TOT, parte $K: quadros $A..$((A+Q))"
          R=$(python3 -c "print($FPS*$V)")
          ffmpeg -v error -y -ss $(python3 -c "print($A/$FPS)") -i src.mp4 -an \
            -vf "mpdecimate=hi=200:lo=64:frac=0.1,minterpolate=fps=$FPS:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1,setpts=(PTS-STARTPTS)/$V,tpad=stop_mode=clone:stop=48" \
            -frames:v $Q -r $R -fps_mode cfr -c:v libx264 -preset slow -crf 18 -maxrate 9M -bufsize 18M -pix_fmt yuv420p -g 56 -bf 2 -x264-params scenecut=0 p$(printf %03d $K).mp4
          ffprobe -v error -count_packets -show_entries stream=nb_read_packets -of csv=p=0 p$(printf %03d $K).mp4
      - uses: actions/upload-artifact@v4
        with: { name: 'p-${{ matrix.k }}', path: 'p*.mp4', retention-days: 2 }
  juntar:
    needs: [plano, parte]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: 'possrc-${{ needs.plano.outputs.id }}', path: src }
      - uses: actions/download-artifact@v4
        with: { pattern: 'p-*', merge-multiple: true, path: w }
      - run: for i in 1 2 3; do command -v ffmpeg && break; (timeout 60 sudo apt-get update -qq && timeout 150 sudo apt-get install -y -qq ffmpeg > /dev/null) || sleep 5; done
      - run: |
          ID=${{ needs.plano.outputs.id }}
          ls w/p*.mp4 | sort | sed "s/^/file '/;s/$/'/" | sed "s#file 'w/#file '#" > w/l.txt
          ffmpeg -v error -y -f concat -safe 0 -i w/l.txt -i src/limpo.flac -map 0:v -map 1:a -c:v copy -c:a aac -b:a 256k -ar 48000 -shortest -movflags +faststart w/$ID.mp4
          ffprobe -v error -show_entries format=duration,bit_rate:stream=codec_type,duration,nb_frames -of compact w/$ID.mp4
          mkdir -p pub && for t in 5 60 160 300 420; do ffmpeg -v error -ss $t -i w/$ID.mp4 -frames:v 1 -vf scale=960:-1 pub/q_$t.jpg || true; done
          split -b 90m -d w/$ID.mp4 pub/$ID.mp4.part_; sha256sum w/$ID.mp4 > pub/sha256.txt; ls -la pub
          cd pub && git init -q -b saida-${ID}pos && git config user.name render-bot && git config user.email render-bot@users.noreply.github.com
          git add -A && git commit -qm "pos $ID" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" saida-${ID}pos
