# Renderiza um vídeo em paralelo: divide em N pedaços, cada máquina faz um, e a última junta com o áudio.
# Disparo: Actions > render > Run workflow (id do vídeo, ex.: lss002a), ou um push que mude fila/<id>.txt.
# fila/<id>.txt: linha 1 = número de partes. Linha 2 (opcional, para outra composição): "<Composição> <pasta em public> [quadros]",
# ex.: "SNBVideo snb/v01" (vídeo inteiro) ou "SNBVideo snb/v01 900" (teste com os 900 primeiros quadros).
# Sem a linha 2 vale o padrão: composição Arte com public/l/<id>/data.json e mix.m4a.
name: render
on:
  workflow_dispatch:
    inputs:
      id: { description: 'id do vídeo (pasta em public/l)', required: true }
      partes: { description: 'quantas máquinas em paralelo', default: '20' }
      comp: { description: 'composição (padrão Arte)', default: 'Arte' }
      pasta: { description: 'pasta em public com tempos.json e mix.m4a (só para composição diferente de Arte)', default: '' }
  push:
    paths: ['fila/*.txt']

jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.p.outputs.id }}
      matriz: ${{ steps.p.outputs.matriz }}
      vb: ${{ steps.p.outputs.vb }}
      comp: ${{ steps.p.outputs.comp }}
      props: ${{ steps.p.outputs.props }}
      mix: ${{ steps.p.outputs.mix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: p
        run: |
          ID="${{ github.event.inputs.id }}"; N="${{ github.event.inputs.partes }}"
          if [ -z "$ID" ]; then
            F=$(git diff --name-only HEAD~1 HEAD -- fila 2>/dev/null | grep '\.txt$' | head -1)
            [ -z "$F" ] && F=$(ls -t fila/*.txt | head -1)
            ID=$(basename "$F" .txt); N=$(head -1 "$F" 2>/dev/null | tr -dc 0-9)
          fi
          [ -z "$N" ] && N=20
          L2=$(sed -n 2p "fila/$ID.txt" 2>/dev/null | tr -d '\r' | grep -v '^ *#' || true); COMP=$(echo "$L2" | awk '{print $1}'); PASTA=$(echo "$L2" | awk '{print $2}'); LIM=$(echo "$L2" | awk '{print $3}' | tr -dc 0-9)
          [ -n "${{ github.event.inputs.comp }}" ] && COMP="${{ github.event.inputs.comp }}" && PASTA="${{ github.event.inputs.pasta }}"
          if [ -n "$COMP" ] && [ "$COMP" != "Arte" ] && [ -n "$PASTA" ]; then
            Q=$(python3 -c "import json,math;print(math.ceil(json.load(open('public/$PASTA/tempos.json'))['total']*30))")
            if [ -n "$LIM" ] && [ "$LIM" -lt "$Q" ]; then Q=$LIM; fi
            PROPS="{\"pasta\":\"$PASTA\",\"n\":$Q}"; MIX="public/$PASTA/mix.m4a"
          else
            COMP=Arte; PROPS="{\"id\":\"$ID\",\"semAudio\":true}"; MIX="public/l/$ID/mix.m4a"
            Q=$(python3 -c "import json;print(json.load(open('public/l/$ID/data.json'))['quadros'])")
          fi
          M=$(python3 -c "
          import json;Q=$Q;N=$N;p=-(-Q//N)
          print(json.dumps([{'k':i,'ini':i*p,'fim':min(Q,(i+1)*p)-1} for i in range(N) if i*p<Q]))")
          # painel aceita até 50 MB: 47 MB no total, 128 kbps de áudio, o resto para o vídeo
          VB=$(python3 -c "print(min(8000, int(47*8*1024*1024/($Q/30)/1000 - 128 - 6)))")
          echo "id=$ID" >> $GITHUB_OUTPUT; echo "matriz=$M" >> $GITHUB_OUTPUT; echo "vb=$VB" >> $GITHUB_OUTPUT
          echo "comp=$COMP" >> $GITHUB_OUTPUT; echo "props=$PROPS" >> $GITHUB_OUTPUT; echo "mix=$MIX" >> $GITHUB_OUTPUT
          echo "$ID: $Q quadros em $N partes"

  render:
    needs: plano
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        parte: ${{ fromJson(needs.plano.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx remotion browser ensure
      - name: render ${{ matrix.parte.ini }}-${{ matrix.parte.fim }}
        run: |
          npx remotion render src/index.ts ${{ needs.plano.outputs.comp }} saida.mp4 --props='${{ needs.plano.outputs.props }}' \
            --frames=${{ matrix.parte.ini }}-${{ matrix.parte.fim }} --muted --concurrency=4 --video-bitrate=${{ needs.plano.outputs.vb }}K --x264-preset=slow --log=info
          mv saida.mp4 parte_$(printf %03d ${{ matrix.parte.k }}).mp4
      - uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.parte.k }}
          path: parte_*.mp4
          retention-days: 3

  juntar:
    needs: [plano, render]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'parte-*', merge-multiple: true, path: partes }
      - name: ffmpeg (com limite de tempo e nova tentativa, o apt às vezes trava)
        run: |
          for i in 1 2 3; do command -v ffmpeg && break; (timeout 60 sudo apt-get update -qq && timeout 150 sudo apt-get install -y -qq ffmpeg > /dev/null) || sleep 5; done; ffmpeg -version | head -1
      - name: juntar (cópia direta, sem recomprimir) e conferir
        run: |
          ID=${{ needs.plano.outputs.id }}
          ls partes/*.mp4 | sort | sed "s/^/file '/;s/$/'/" > lista.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i lista.txt -i ${{ needs.plano.outputs.mix }} -map 0:v -map 1:a -c:v copy -c:a aac -b:a 128k -shortest -movflags +faststart $ID.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 $ID.mp4; ls -la $ID.mp4
          mkdir -p conf && for t in 2 5 12 20 60 200 400 480; do ffmpeg -loglevel error -ss $t -i $ID.mp4 -frames:v 1 -vf scale=480:-1 conf/q_$t.jpg || true; done
      - name: publicar no ramo saida-<id>
        run: |
          ID=${{ needs.plano.outputs.id }}
          mkdir pub && mv $ID.mp4 conf pub/ && cd pub
          git init -q -b saida-$ID && git config user.name render-bot && git config user.email render-bot@users.noreply.github.com
          git add -A && git commit -qm "vídeo $ID ($(date -u +%FT%TZ))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" saida-$ID
